<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Laporan Produksi - Production Report Management System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

        body {
            font-family: 'Inter', sans-serif;
        }

        .progress-bar {
            transition: width 0.3s ease;
        }

        .modal {
            display: none;
        }

        .modal.active {
            display: flex;
        }

        .fade-in {
            animation: fadeIn 0.3s ease-in;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .hover-scale {
            transition: transform 0.2s;
        }

        .hover-scale:hover {
            transform: scale(1.02);
        }
    </style>
</head>
<body class="bg-gray-50">
    <!-- Header Section -->
    <div class="bg-white border-b border-gray-200">
        <div class="max-w-[1400px] mx-auto px-6 py-8">
            <!-- Breadcrumb -->
            <nav class="mb-4 flex items-center space-x-2 text-sm">
                <a href="#" class="text-gray-600 hover:text-blue-600">Dashboard</a>
                <span class="text-gray-400">/</span>
                <a href="#" class="text-gray-600 hover:text-blue-600">Produksi</a>
                <span class="text-gray-400">/</span>
                <span class="text-gray-900 font-medium">Laporan Produksi</span>
            </nav>

            <h1 class="text-3xl font-semibold text-gray-900 mb-2">Laporan Produksi</h1>
            <p class="text-gray-600">Monitoring progres produksi pesanan pelanggan secara real-time.</p>
        </div>
    </div>

    <!-- Main Content -->
    <div class="max-w-[1400px] mx-auto px-6 py-8">
        <!-- Statistics Cards -->
        <div id="statsCards" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6 mb-8">
            <!-- Cards will be generated by JavaScript -->
        </div>

        <!-- Filters -->
        <div class="bg-white rounded-lg shadow-sm mb-6 p-6">
            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-5 gap-4">
                <input
                    type="text"
                    id="searchId"
                    placeholder="Cari berdasarkan No/ID..."
                    class="px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
                >

                <input
                    type="text"
                    id="searchCustomer"
                    placeholder="Cari Nama Pelanggan..."
                    class="px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
                >

                <select
                    id="statusFilter"
                    class="px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
                >
                    <option value="all">Semua Status</option>
                    <option value="Belum Diproses">Belum Diproses</option>
                    <option value="Dalam Produksi">Dalam Produksi</option>
                    <option value="Finishing">Finishing</option>
                    <option value="Selesai">Selesai</option>
                </select>

                <input
                    type="date"
                    id="dateFrom"
                    class="px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
                >

                <input
                    type="date"
                    id="dateTo"
                    class="px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
                >
            </div>

            <div class="flex gap-3 mt-4">
                <button
                    onclick="applyFilters()"
                    class="px-6 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition-colors flex items-center gap-2"
                >
                    <i class="fas fa-search"></i>
                    Cari
                </button>
                <button
                    onclick="resetFilters()"
                    class="px-6 py-2 border border-gray-300 text-gray-700 rounded-lg hover:bg-gray-50 transition-colors flex items-center gap-2"
                >
                    <i class="fas fa-rotate-right"></i>
                    Reset Filter
                </button>
            </div>
        </div>

        <!-- Data Table -->
        <div class="bg-white rounded-lg shadow-sm overflow-hidden">
            <div class="overflow-x-auto">
                <table class="w-full">
                    <thead class="bg-gray-50">
                        <tr>
                            <th class="px-6 py-4 text-left text-sm font-semibold text-gray-700">No/ID</th>
                            <th class="px-6 py-4 text-left text-sm font-semibold text-gray-700">Nama Pelanggan</th>
                            <th class="px-6 py-4 text-left text-sm font-semibold text-gray-700">Progress Produksi</th>
                            <th class="px-6 py-4 text-left text-sm font-semibold text-gray-700">Foto Progress</th>
                            <th class="px-6 py-4 text-left text-sm font-semibold text-gray-700">File SPK/Invoice</th>
                            <th class="px-6 py-4 text-left text-sm font-semibold text-gray-700">Tanggal Update</th>
                            <th class="px-6 py-4 text-right text-sm font-semibold text-gray-700">Aksi</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody">
                        <!-- Rows will be generated by JavaScript -->
                    </tbody>
                </table>
            </div>

            <!-- Pagination -->
            <div class="flex items-center justify-between px-6 py-4 border-t border-gray-200">
                <p id="paginationInfo" class="text-sm text-gray-600"></p>
                <div id="paginationButtons" class="flex gap-2">
                    <!-- Pagination buttons will be generated by JavaScript -->
                </div>
            </div>
        </div>
    </div>

    <!-- Detail Modal -->
    <div id="detailModal" class="modal fixed inset-0 bg-black bg-opacity-50 items-center justify-center z-50 p-4">
        <div class="bg-white rounded-lg max-w-3xl w-full max-h-[90vh] overflow-y-auto fade-in">
            <div class="sticky top-0 bg-white border-b border-gray-200 px-6 py-4 z-10">
                <div class="flex items-center justify-between">
                    <div>
                        <h2 class="text-2xl font-semibold text-gray-900">Detail Produksi</h2>
                        <p class="text-gray-600 text-sm mt-1">Informasi lengkap pesanan produksi</p>
                    </div>
                    <button onclick="closeModal()" class="text-gray-400 hover:text-gray-600 text-2xl">
                        <i class="fas fa-times"></i>
                    </button>
                </div>
            </div>

            <div id="modalContent" class="p-6">
                <!-- Modal content will be generated by JavaScript -->
            </div>

            <div class="sticky bottom-0 bg-white border-t border-gray-200 px-6 py-4 flex justify-end gap-3">
                <button onclick="closeModal()" class="px-6 py-2 border border-gray-300 text-gray-700 rounded-lg hover:bg-gray-50">
                    Tutup
                </button>
                <button class="px-6 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 flex items-center gap-2">

                ]

        let filteredOrders = [...mockOrders];
        let currentPage = 1;
        const itemsPerPage = 10;

        // Helper Functions
        function getInitials(name) {
            return name.split(' ').map(n => n[0]).join('').toUpperCase().slice(0, 2);
        }

        function getStatusColor(status) {
            const colors = {
                "Belum Diproses": { bg: "bg-gray-100", text: "text-gray-700" },
                "Dalam Produksi": { bg: "bg-blue-100", text: "text-blue-600" },
                "Finishing": { bg: "bg-orange-100", text: "text-orange-700" },
                "Selesai": { bg: "bg-green-100", text: "text-green-600" }
            };
            return colors[status] || colors["Belum Diproses"];
        }

        function getStatusIcon(status) {
            const icons = {
                "Belum Diproses": "fa-clock",
                "Dalam Produksi": "fa-gears",
                "Finishing": "fa-wrench",
                "Selesai": "fa-circle-check"
            };
            return icons[status] || icons["Belum Diproses"];
        }

        // Render Statistics Cards
        function renderStatsCards() {
            const stats = {
                total: filteredOrders.length,
                dalamProduksi: filteredOrders.filter(o => o.status === "Dalam Produksi").length,
                finishing: filteredOrders.filter(o => o.status === "Finishing").length,
                selesai: filteredOrders.filter(o => o.status === "Selesai").length
            };

            const cards = [
                { title: "Total Pesanan", value: stats.total, icon: "fa-box", bgColor: "bg-blue-50", textColor: "text-blue-600" },
                { title: "Dalam Produksi", value: stats.dalamProduksi, icon: "fa-gears", bgColor: "bg-blue-50", textColor: "text-blue-600" },
                { title: "Finishing", value: stats.finishing, icon: "fa-wrench", bgColor: "bg-orange-50", textColor: "text-orange-600" },
                { title: "Selesai", value: stats.selesai, icon: "fa-circle-check", bgColor: "bg-green-50", textColor: "text-green-600" }
            ];

            const html = cards.map(card => `
                <div class="bg-white rounded-lg shadow-sm p-6 hover-scale">
                    <div class="flex items-center justify-between">
                        <div>
                            <p class="text-gray-600 text-sm mb-1">${card.title}</p>
                            <h3 class="text-3xl font-bold ${card.textColor}">${card.value}</h3>
                        </div>
                        <div class="${card.bgColor} p-4 rounded-lg">
                            <i class="fas ${card.icon} text-2xl ${card.textColor}"></i>
                        </div>
                    </div>
                </div>
            `).join('');

            document.getElementById('statsCards').innerHTML = html;
        }

        // Render Table
        function renderTable() {
            const startIndex = (currentPage - 1) * itemsPerPage;
            const endIndex = startIndex + itemsPerPage;
            const currentOrders = filteredOrders.slice(startIndex, endIndex);

            const html = currentOrders.map(order => {
                const statusColor = getStatusColor(order.status);
                return `
                    <tr class="border-b border-gray-200 hover:bg-gray-50 transition-colors">
                        <td class="px-6 py-4 font-medium text-blue-600">${order.id}</td>
                        <td class="px-6 py-4">
                            <div class="flex items-center gap-3">
                                <div class="w-9 h-9 rounded-full bg-blue-600 text-white flex items-center justify-center text-xs font-semibold">
                                    ${getInitials(order.customerName)}
                                </div>
                                <span class="font-medium text-gray-900">${order.customerName}</span>
                            </div>
                        </td>
                        <td class="px-6 py-4">
                            <div class="space-y-2 min-w-[200px]">
                                <span class="inline-flex px-3 py-1 rounded-full text-xs font-medium ${statusColor.bg} ${statusColor.text}">
                                    ${order.status}
                                </span>
                                <div class="space-y-1">
                                    <div class="w-full bg-gray-200 rounded-full h-2">
                                        <div class="bg-blue-600 h-2 rounded-full progress-bar" style="width: ${order.progress}%"></div>
                                    </div>
                                    <p class="text-xs text-gray-500">${order.progress}% selesai</p>
                                </div>
                            </div>
                        </td>
                        <td class="px-6 py-4">
                            <img src="${order.progressImage}" alt="Progress"
                                 class="w-16 h-16 object-cover rounded-lg cursor-pointer hover:opacity-80 transition-opacity"
                                 onclick="openModal('${order.id}')">
                        </td>
                        <td class="px-6 py-4">
                            <div class="flex items-center gap-2">
                                <i class="fas fa-file-pdf text-red-500 text-xl"></i>
                                <div>
                                    <p class="text-sm font-medium text-gray-900">SPK-${order.id}.pdf</p>
                                    <a href="${order.spkFile}" class="text-xs text-blue-600 hover:underline">Download</a>
                                </div>
                            </div>
                        </td>
                        <td class="px-6 py-4 text-gray-600">${order.lastUpdate}</td>
                        <td class="px-6 py-4 text-right">
                            <div class="flex justify-end gap-2">
                                <button onclick="openModal('${order.id}')"
                                        class="px-4 py-2 border border-gray-300 text-gray-700 rounded-lg hover:bg-gray-50 text-sm flex items-center gap-2">
                                    <i class="fas fa-eye"></i>
                                    Detail
                                </button>
                                <button class="px-4 py-2 border border-blue-600 text-blue-600 rounded-lg hover:bg-blue-50 text-sm flex items-center gap-2">
                                    <i class="fas fa-download"></i>
                                    Laporan
                                </button>
                            </div>
                        </td>
                    </tr>
                `;
            }).join('');

            document.getElementById('tableBody').innerHTML = html;
            renderPagination();
        }

        // Render Pagination
        function renderPagination() {
            const totalPages = Math.ceil(filteredOrders.length / itemsPerPage);
            const startIndex = (currentPage - 1) * itemsPerPage;
            const endIndex = Math.min(startIndex + itemsPerPage, filteredOrders.length);

            document.getElementById('paginationInfo').textContent =
                `Menampilkan ${startIndex + 1} - ${endIndex} dari ${filteredOrders.length} pesanan`;

            let buttonsHtml = `
                <button onclick="changePage(${currentPage - 1})"
                        ${currentPage === 1 ? 'disabled' : ''}
                        class="px-4 py-2 border border-gray-300 rounded-lg hover:bg-gray-50 disabled:opacity-50 disabled:cursor-not-allowed">
                    <i class="fas fa-chevron-left"></i>
                </button>
            `;

            for (let i = 1; i <= totalPages; i++) {
                buttonsHtml += `
                    <button onclick="changePage(${i})"
                            class="px-4 py-2 border rounded-lg ${currentPage === i ? 'bg-blue-600 text-white border-blue-600' : 'border-gray-300 hover:bg-gray-50'}">
                        ${i}
                    </button>
                `;
            }

            buttonsHtml += `
                <button onclick="changePage(${currentPage + 1})"
                        ${currentPage === totalPages ? 'disabled' : ''}
                        class="px-4 py-2 border border-gray-300 rounded-lg hover:bg-gray-50 disabled:opacity-50 disabled:cursor-not-allowed">
                    <i class="fas fa-chevron-right"></i>
                </button>
            `;

            document.getElementById('paginationButtons').innerHTML = buttonsHtml;
        }

        // Change Page
        function changePage(page) {
            const totalPages = Math.ceil(filteredOrders.length / itemsPerPage);
            if (page >= 1 && page <= totalPages) {
                currentPage = page;
                renderTable();
            }
        }

        // Apply Filters
        function applyFilters() {
            const searchId = document.getElementById('searchId').value.toLowerCase();
            const searchCustomer = document.getElementById('searchCustomer').value.toLowerCase();
            const statusFilter = document.getElementById('statusFilter').value;
            const dateFrom = document.getElementById('dateFrom').value;
            const dateTo = document.getElementById('dateTo').value;

            filteredOrders = mockOrders.filter(order => {
                const matchId = !searchId || order.id.toLowerCase().includes(searchId);
                const matchCustomer = !searchCustomer || order.customerName.toLowerCase().includes(searchCustomer);
                const matchStatus = statusFilter === 'all' || order.status === statusFilter;

                let matchDateFrom = true;
                let matchDateTo = true;

                if (dateFrom) {
                    const orderDate = new Date(order.lastUpdate);
                    matchDateFrom = orderDate >= new Date(dateFrom);
                }

                if (dateTo) {
                    const orderDate = new Date(order.lastUpdate);
                    matchDateTo = orderDate <= new Date(dateTo);
                }

                return matchId && matchCustomer && matchStatus && matchDateFrom && matchDateTo;
            });

            currentPage = 1;
            renderStatsCards();
            renderTable();
        }

        // Reset Filters
        function resetFilters() {
            document.getElementById('searchId').value = '';
            document.getElementById('searchCustomer').value = '';
            document.getElementById('statusFilter').value = 'all';
            document.getElementById('dateFrom').value = '';
            document.getElementById('dateTo').value = '';

            filteredOrders = [...mockOrders];
            currentPage = 1;
            renderStatsCards();
            renderTable();
        }

        // Open Modal
        function openModal(orderId) {
            const order = mockOrders.find(o => o.id === orderId);
            if (!order) return;

            const statusColor = getStatusColor(order.status);
            const statusIcon = getStatusIcon(order.status);

            const timelineHtml = order.timeline.map((item, index) => `
                <div class="flex gap-4">
                    <div class="flex flex-col items-center">
                        <div class="w-3 h-3 rounded-full ${index === 0 ? 'bg-green-500' : 'bg-gray-300'}"></div>
                        ${index !== order.timeline.length - 1 ? '<div class="w-0.5 h-12 bg-gray-200"></div>' : ''}
                    </div>
                    <div class="flex-1 pb-4">
                        <p class="font-medium text-gray-900">${item.status}</p>
                        <p class="text-sm text-gray-600">${item.description}</p>
                        <p class="text-xs text-gray-500 mt-1">${item.date}</p>
                    </div>
                </div>
            `).join('');

            const modalContent = `
                <div class="space-y-6">
                    <!-- Customer Information -->
                    <div class="bg-gray-50 rounded-lg p-6">
                        <h3 class="flex items-center gap-2 text-lg font-semibold text-gray-900 mb-4">
                            <i class="fas fa-user"></i>
                            Informasi Pelanggan
                        </h3>
                        <div class="flex items-center gap-4">
                            <div class="w-16 h-16 rounded-full bg-blue-600 text-white flex items-center justify-center text-xl font-semibold">
                                ${getInitials(order.customerName)}
                            </div>
                            <div>
                                <p class="font-semibold text-lg text-gray-900">${order.customerName}</p>
                                <p class="text-gray-600">Order ID: ${order.id}</p>
                            </div>
                        </div>
                    </div>

                    <!-- Production Status -->
                    <div>
                        <h3 class="flex items-center gap-2 text-lg font-semibold text-gray-900 mb-4">
                            <i class="fas ${statusIcon} ${statusColor.text}"></i>
                            Status Produksi
                        </h3>
                        <div class="space-y-3">
                            <div class="flex items-center justify-between">
                                <span class="inline-flex px-4 py-2 rounded-full text-sm font-medium ${statusColor.bg} ${statusColor.text}">
                                    ${order.status}
                                </span>
                                <span class="text-xl font-bold text-gray-900">${order.progress}%</span>
                            </div>
                            <div class="w-full bg-gray-200 rounded-full h-3">
                                <div class="bg-blue-600 h-3 rounded-full progress-bar" style="width: ${order.progress}%"></div>
                            </div>
                        </div>
                    </div>

                    <hr class="border-gray-200">

                    <!-- Timeline -->
                    <div>
                        <h3 class="flex items-center gap-2 text-lg font-semibold text-gray-900 mb-4">
                            <i class="fas fa-calendar-alt"></i>
                            Timeline Produksi
                        </h3>
                        <div class="space-y-4">
                            ${timelineHtml}
                        </div>
                    </div>

                    <hr class="border-gray-200">

                    <!-- Progress Photos -->
                    <div>
                        <h3 class="text-lg font-semibold text-gray-900 mb-4">Galeri Foto Progress</h3>
                        <div class="grid grid-cols-2 gap-4">
                            <img src="${order.progressImage}" alt="Progress 1" class="w-full h-48 object-cover rounded-lg">
                            <img src="${order.progressImage}" alt="Progress 2" class="w-full h-48 object-cover rounded-lg opacity-80">
                        </div>
                    </div>

                    <hr class="border-gray-200">

                    <!-- Documents -->
                    <div>
                        <h3 class="flex items-center gap-2 text-lg font-semibold text-gray-900 mb-4">
                            <i class="fas fa-file-text"></i>
                            Dokumen Terlampir
                        </h3>
                        <div class="bg-gray-50 rounded-lg p-4 flex items-center justify-between">
                            <div class="flex items-center gap-3">
                                <div class="bg-red-100 p-3 rounded-lg">
                                    <i class="fas fa-file-pdf text-2xl text-red-500"></i>
                                </div>
                                <div>
                                    <p class="font-medium text-gray-900">SPK-${order.id}.pdf</p>
                                    <p class="text-sm text-gray-600">Surat Perintah Kerja & Invoice</p>
                                </div>
                            </div>
                            <a href="${order.spkFile}"
                               class="px-4 py-2 border border-blue-600 text-blue-600 rounded-lg hover:bg-blue-50 flex items-center gap-2">
                                <i class="fas fa-download"></i>
                                Download
                            </a>
                        </div>
                    </div>

                    <!-- Notes -->
                    ${order.notes ? `
                        <hr class="border-gray-200">
                        <div>
                            <h3 class="text-lg font-semibold text-gray-900 mb-3">Catatan Produksi</h3>
                            <p class="text-gray-700 bg-yellow-50 border-l-4 border-yellow-400 p-4 rounded">
                                ${order.notes}
                            </p>
                        </div>
                    ` : ''}

                    <!-- Last Update -->
                    <div class="bg-gray-50 rounded-lg p-4">
                        <p class="text-sm text-gray-600">
                            Terakhir diperbarui: <span class="font-medium text-gray-900">${order.lastUpdate}</span>
                        </p>
                    </div>
                </div>
            `;

            document.getElementById('modalContent').innerHTML = modalContent;
            document.getElementById('detailModal').classList.add('active');
        }

        // Close Modal
        function closeModal() {
            document.getElementById('detailModal').classList.remove('active');
        }

        // Close modal when clicking outside
        document.getElementById('detailModal').addEventListener('click', function(e) {
            if (e.target === this) {
                closeModal();
            }
        });

        // Initialize
        document.addEventListener('DOMContentLoaded', function() {
            renderStatsCards();
            renderTable();
        });
    </script>
</body>
</html>
